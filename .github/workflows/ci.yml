name: powershell / main

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  ci:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, windows-2022]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Run exercism/powershell ci (runs tests) for all exercises
        shell: pwsh
        run: bin/run-tests.ps1

  tests:
    name: Tests
    needs: ci
    if: always()
    runs-on: ubuntu-26.04
    steps:
      - name: Check that every configuration passed
        env:
          RESULT: ${{ needs.ci.result }}
        run: |
          if [[ "$RESULT" != "success" ]]; then
            echo "The exercise tests failed on at least one configuration."
            exit 1
          fi
